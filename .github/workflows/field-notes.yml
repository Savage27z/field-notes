name: Field notes

on:
  schedule:
    - cron: "17 2 * * *"
      timezone: "Africa/Lagos"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Add daily notes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "SAVAGE✰"
          git config user.email "142899691+Savage27z@users.noreply.github.com"

          note_day="$(TZ=Africa/Lagos date +%F)"
          note_file="notes/${note_day}.md"
          commit_count=$((40 + RANDOM % 61))
          mkdir -p notes
          touch "${note_file}"

          for entry in $(seq -w 1 "${commit_count}"); do
            offset=$((10#${entry} - 1))
            hour=$((offset / 60))
            minute=$((offset % 60))
            printf -v stamp "%s %02d:%02d:00 +0100" "${note_day}" "${hour}" "${minute}"
            printf -- "- %s · entry %s of %s\n" "${note_day}" "${entry}" "${commit_count}" >> "${note_file}"
            git add "${note_file}"
            GIT_AUTHOR_DATE="${stamp}" GIT_COMMITTER_DATE="${stamp}" \
              git commit -m "notes: ${note_day} ${entry}"
          done

          git push origin HEAD:main
